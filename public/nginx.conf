index index.php;

etag off;
gzip off;
autoindex off;

# Remove a barra no final da URL, exceto para diretórios
if (!-d $request_filename) {
    rewrite ^/(.+)/$ /$1 permanent;
}

# Retorna 404 para favicon.ico se ele não existir. Visa evitar chamadas duplas
# ao framework, principalmente durante o desenvolvimento em que não há um
# favicondefinido.
location = /favicon.ico {
    try_files $uri =404;
}

# Bloqueia o acesso a arquivos como .htaccess e .htpasswd.
location ~ /\.ht {
    deny all;
}

# Preserva diretórios existentes e encaminha o restante ao bootstrap.
location / {
    try_files $uri/ /index.php?$query_string;
}
